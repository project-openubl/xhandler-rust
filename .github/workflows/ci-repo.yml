name: CI

on:
  push:
    branches-ignore:
      - "dependabot/**"
    paths-ignore:
      - 'README.md'
  pull_request: { }

env:
  CI: true

jobs:
  cargo-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Install clippy
        run: rustup component add clippy
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - run: cargo test

  # The libraries must keep building for Android and iOS (xhandler-mobile)
  mobile-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - run: rustup target add aarch64-linux-android aarch64-apple-ios
      # Without the http feature xhandler is pure Rust: no C toolchain for the target is needed
      - run: cargo check -p xhandler --no-default-features --target aarch64-apple-ios
      # reqwest's TLS (ring) compiles C, so use the runner's Android NDK
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk --target arm64-v8a check -p xhandler

  # The WebAssembly core of the Go, Python and Java bindings (xhandler-wasm):
  # the corpus generation fails if the native core disagrees with a snapshot
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - run: cargo check -p xhandler --no-default-features --target wasm32-wasip1
      - run: make -C xhandler-wasm dist
