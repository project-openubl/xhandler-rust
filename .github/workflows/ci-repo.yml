name: CI

on:
  push:
    branches-ignore:
      - "dependabot/**"
    paths-ignore:
      - 'README.md'
  pull_request: { }

env:
  CI: true

jobs:
  cargo-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Install clippy
        run: rustup component add clippy
      - run: cargo fmt --check
      - run: cargo check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - run: cargo test
      # What the release publishes to crates.io packages and builds
      - run: cargo publish --workspace --dry-run

  # The libraries must keep building for Android and iOS (xhandler-mobile)
  mobile-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - run: rustup target add aarch64-linux-android aarch64-apple-ios
      # Without the http feature xhandler is pure Rust: no C toolchain for the target is needed
      - run: cargo check -p xhandler --no-default-features --target aarch64-apple-ios
      # reqwest's TLS (ring) compiles C, so use the runner's Android NDK
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk --target arm64-v8a check -p xhandler

  # The release's static Linux binary of the CLI (musl) must keep building
  cli-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - run: sudo apt-get update -q && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      # As the release does: the tag's version, then the build
      - run: ./hack/set-version.sh 0.0.0-ci.1
      - run: cargo build -p xhandler-cli --target x86_64-unknown-linux-musl

  # The WebAssembly core of the Go, Python and Java bindings (xhandler-wasm):
  # the corpus generation fails if the native core disagrees with a snapshot
  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - run: cargo check -p xhandler --no-default-features --target wasm32-wasip1
      - run: make -C xhandler-wasm dist
