name: Release

# Runs when a release is published (release-tools' release-xhandler workflow creates it, or
# by hand). The tag is the version: Cargo.toml on main says 0.0.0-dev and this workflow sets
# the tag's version before building.
#
# Attaches to the release:
# - xhandler-dist-<version>.tar.gz: what the Go, Python and Java libraries sync (`make sync
#   CORE=<version>` there), plus xhandler.wasm alone and SHA256SUMS, which their
#   `make verify-core` checks
# - the xhandler binaries for Linux, macOS and Windows
# and publishes xhandler and xhandler-cli to crates.io. Rerunning skips what is published.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v6.0.0-alpha.1"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          version="${TAG#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          echo "version=$version" >> "$GITHUB_OUTPUT"

  dist:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: ./.github/actions/install-dependencies
      - run: ./hack/set-version.sh "$VERSION"
      - run: make -C xhandler-wasm dist
      - name: Assets
        run: |
          mkdir assets
          tar -czf "assets/xhandler-dist-$VERSION.tar.gz" -C dist .
          cp dist/xhandler.wasm assets/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: assets/*

  cli:
    needs: version
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: Swatinem/rust-cache@v2.9.3
      - run: ./hack/set-version.sh "$VERSION"
        shell: bash
      - run: cargo build --release -p xhandler-cli
      - name: Package
        shell: bash
        run: |
          name="xhandler-$VERSION-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/xhandler.exe "$name/"
            7z a "$name.zip" "$name" >/dev/null
          else
            cp target/release/xhandler "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: xhandler-${{ env.VERSION }}-*

  upload:
    needs: [dist, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: assets
          merge-multiple: true
      - run: (cd assets && sha256sum * > SHA256SUMS)
      - run: gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  crates-io:
    needs: [version, upload]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # crates.io trusted publishing can't create a crate: the first release uses this
      # token, later ones the OIDC token (configure trusted publishing, then delete it)
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
      - run: ./hack/set-version.sh "$VERSION"
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        if: env.HAS_TOKEN != 'true'
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          for crate in xhandler xhandler-cli; do
            if curl -sf -A "project-openubl release" "https://crates.io/api/v1/crates/$crate/$VERSION" >/dev/null; then
              echo "$crate $VERSION is already published"
            else
              # The version set from the tag is the only change
              cargo publish --allow-dirty -p "$crate"
            fi
          done
