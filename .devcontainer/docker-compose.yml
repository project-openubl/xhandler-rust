networks:
  openubl:
    name: "openubl"

services:
  xhander-rust:
    image: localhost/devcontainer-xhander-rust:latest
    build:
      dockerfile: ./Dockerfile
    security_opt:
      - "label=disable"
    userns_mode: "keep-id"
    command: /bin/sh -c "while sleep 1000; do :; done"
    volumes:
      - ..:/workspace:cached
    networks:
      - openubl
