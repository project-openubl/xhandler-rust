[package]
name = "xsender"
description = "Sends XML files through SOAP - SUNAT"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xml = { workspace = true }
zip = { workspace = true }
tera = { workspace = true }
static-files = { workspace = true }
lazy_static = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
reqwest = { workspace = true, optional = true }
serde_urlencoded = "0.7"
tokio = { workspace = true, features = ["time", "sync"], optional = true }
regex = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
sha2 = { workspace = true }
encoding_rs = { workspace = true }

[features]
default = ["http"]
# SunatClient and FileSender's sending: reqwest. Without it, xsender builds
# and parses the SUNAT requests (exchange) for another HTTP client.
http = ["dep:reqwest", "dep:tokio"]

[[test]]
name = "send_files"
required-features = ["http"]

[dev-dependencies]
serial_test = { workspace = true }
tokio = { workspace = true, features = ["macros"] }

[build-dependencies]
static-files = { workspace = true }
