[workspace]
resolver = "2"
members = [
    "xbuilder",
    "xsender",
    "xsigner",
    "xhandler",
    "cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
log = "0.4"
tera = "1.20"
static-files = "0.3"
lazy_static = "1.5"
serde = { version = "1.0", features = ["derive"] }
rust_decimal = { version = "1.36" }
rust_decimal_macros = "1.36"
xml = "1.4"
zip = { version = "7.0", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
base64 = "0.22"
thiserror = "2.0"
anyhow = "1.0"
sha2 = "0.11"
encoding_rs = "0.8"
serial_test = "3.4"
tokio = "1.49"
libxml = "0.3"
quick-xml = "0.39"
rsa = { version = "0.10", features = ["pkcs1v15"] }
x509-cert = "0.3"
p12-keystore = "0.4"

clap = "4"
serde_json = "1"
serde_yaml = "0.9"
