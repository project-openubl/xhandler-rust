[workspace]
resolver = "2"
members = [
    "xhandler",
    "cli",
    "xhandler-wasm",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
publish = false
license = "Apache-2.0"
repository = "https://github.com/project-openubl/xhandler-rust"
homepage = "https://project-openubl.github.io"

[workspace.dependencies]
xhandler = { path = "xhandler", version = "0.1.1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
regex = "1.11"
log = "0.4"
tera = { version = "1.20", default-features = false }
static-files = "0.3"
lazy_static = "1.5"
serde = { version = "1.0", features = ["derive"] }
rust_decimal = { version = "1.36" }
rust_decimal_macros = "1.36"
xml = "1.4"
zip = { version = "7.0", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
base64 = "0.22"
thiserror = "2.0"
anyhow = "1.0"
sha2 = "0.11"
encoding_rs = "0.8"
serial_test = "3.4"
tokio = "1.49"
libxml = "0.3"
quick-xml = "0.39"
rsa = { version = "0.10", features = ["pkcs1v15"] }
x509-cert = "0.3"
p12-keystore = "0.4"
schemars = { version = "1", features = ["chrono04", "rust_decimal1"] }

clap = "4"
serde_json = "1"
serde_urlencoded = "0.7"
serde_yaml = "0.9"

# Small WebAssembly module for the bindings: cargo build --profile wasm
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
